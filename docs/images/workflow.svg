<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 622" role="img" aria-label="Alur kerja SlopGuard, tujuh langkah dari gerbang assets sampai kirim">
<rect width="960" height="622" rx="8" fill="#111111"/>
<text x="32" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">Alur kerja</text>
<text x="32" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#B5B5B5">Urutannya tetap. Langkah 00 tidak boleh dilewati.</text>
