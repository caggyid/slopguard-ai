<text x="112" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#B5B5B5">Paling banyak lima pertanyaan: produk, halaman, stack, nada.</text>
