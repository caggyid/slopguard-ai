<text x="112" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#374151">Tanya dulu: ada, sebagian, atau tidak ada. Berhenti sampai dijawab.</text>
<text x="904" y="168" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#555555">assets/</text>
